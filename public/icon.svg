<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pitch Black Background -->
  <rect width="512" height="512" rx="128" fill="#000000" />
  
  <!-- Cyber Matrix Neon Grid Lines -->
  <line x1="128" y1="0" x2="128" y2="512" stroke="#10B981" stroke-width="4" stroke-opacity="0.2" />
  <line x1="256" y1="0" x2="256" y2="512" stroke="#10B981" stroke-width="6" stroke-opacity="0.3" />
  <line x1="384" y1="0" x2="384" y2="512" stroke="#10B981" stroke-width="4" stroke-opacity="0.2" />
  
  <line x1="0" y1="128" x2="512" y2="128" stroke="#10B981" stroke-width="4" stroke-opacity="0.2" />
  <line x1="0" y1="256" x2="512" y2="256" stroke="#10B981" stroke-width="6" stroke-opacity="0.3" />
  <line x1="0" y1="384" x2="512" y2="384" stroke="#10B981" stroke-width="4" stroke-opacity="0.2" />

  <!-- Outer Neon Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" filter="drop-shadow(0 0 12px #10B981)" />

  <!-- Mathematical Matrix Elements inside the grid -->
  <!-- Upper Left: Σ -->
  <text x="128" y="148" font-family="monospace" font-size="72" font-weight="900" fill="#3B82F6" text-anchor="middle" dominant-baseline="central" filter="drop-shadow(0 0 8px #3B82F6)">∑</text>
  
  <!-- Upper Right: x -->
  <text x="384" y="148" font-family="monospace" font-size="72" font-weight="900" fill="#10B981" text-anchor="middle" dominant-baseline="central" filter="drop-shadow(0 0 8px #10B981)">x</text>
  
  <!-- Lower Left: √ -->
  <text x="128" y="364" font-family="monospace" font-size="72" font-weight="900" fill="#10B981" text-anchor="middle" dominant-baseline="central" filter="drop-shadow(0 0 8px #10B981)">√</text>
  
  <!-- Lower Right: π -->
  <text x="384" y="364" font-family="monospace" font-size="72" font-weight="900" fill="#3B82F6" text-anchor="middle" dominant-baseline="central" filter="drop-shadow(0 0 8px #3B82F6)">π</text>

  <!-- Center Core: "M²" -->
  <g transform="translate(256, 256)">
    <circle r="72" fill="#000000" stroke="#F59E0B" stroke-width="6" filter="drop-shadow(0 0 16px #F59E0B)" />
    <text x="-12" y="8" font-family="monospace" font-size="64" font-weight="900" fill="#F59E0B" text-anchor="middle" dominant-baseline="central">M</text>
    <text x="24" y="-24" font-family="monospace" font-size="40" font-weight="900" fill="#F59E0B" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
</svg>
